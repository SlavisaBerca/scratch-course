<!DOCTYPE html>
<html lang="en" id="theme">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Two-Factor Authentication | Neykart</title>

    <meta name="description" content="Neykart html template live demo. Check out all the features of the template." />
    <meta name="keywords" content="html5, Tailwind CSS, CSS, JavaScript, Template, Neykart" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/favicons/favicon.png" />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="assets/global/css/theme.min.css" />

    <!-- Plugins Stylesheet -->
    <link rel="stylesheet" href="assets/global/css/plugins/bundle.plugins.css" />

  </head>

  <body class="mx-auto bg-gray-50 antialiased">
    <!-- Loader - Start -->
    <div id="loader">
      <div class="nk-loader-fixed">
        <div class="nk-loader-icon">
          <svg
            class="text-primary-300 h-8 w-8 animate-spin"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Loader - End -->
    <main>
      <div class="mb-10 h-20 w-full bg-gray-900">
        <div class="mx-auto flex h-full w-full flex-row items-center justify-between px-4 text-gray-50 md:max-w-4xl">
          <div class="h-7 font-extrabold">
            <a class="nk-sticky-logo h-full" href="index.html">
              <img class="objact-contain h-full" src="assets/img/logo-white.svg" alt="" />
            </a>
          </div>
          <div class="hidden sm:block">Two-Factor Authentication</div>
          <div class="text-xs hover:underline">
            <a href="shop.html">
              <span>Start Shopping</span>
              <span><i class="fas fa-chevron-right"></i></span>
            </a>
          </div>
        </div>
      </div>
      <div class="flex w-full transform flex-col flex-wrap items-center justify-center px-3 pt-10 text-gray-900 xl:m-0">
        <div class="m-auto w-full rounded border border-gray-300 bg-white shadow-lg sm:w-[300px] sm:max-w-sm">
          <div class="space-y-2 px-5 pt-8">
            <h1 class="text-base font-semibold sm:text-lg">Two-Factor Authentication</h1>
            <p class="text-sm">Enter 6-digit code.</p>
            <h1 class="text-base font-semibold">Authentication Code</h1>
          </div>
          <div class="mt-6 space-y-2 px-5">
            <div class="space-y-3">
              <div class="relative z-0 mb-6 w-full">
                <input
                  id="securityCode"
                  type="password"
                  name="securityCode"
                  class="peer focus:border-primary-600 block w-full appearance-none border-0 border-b-2 border-gray-400 bg-transparent py-2.5 px-0 text-sm text-gray-900 focus:outline-none focus:ring-0"
                  placeholder=" "
                  required
                />
                <span
                  data-password-show-hide="#securityCode"
                  class="hover:text-primary-800 absolute inset-y-0 right-0 float-right flex cursor-pointer items-center p-1 pr-3 pl-3 text-xs"
                  >Show</span
                >
                <label
                  for="securityCode"
                  class="peer-focus:text-primary-600 absolute top-3 -z-10 origin-[0] -translate-y-6 scale-75 transform text-sm text-gray-500 duration-300 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:left-0 peer-focus:-translate-y-6 peer-focus:scale-75"
                  >Security Code</label
                >
              </div>
              <button id="submitButton" class="btn-full btn-gradient">Verify</button>
              <div class="flex flex-col py-2 text-left text-sm">
                <span class="font-semibold">Experience problems?</span>
                <span
                  ><a class="text-blue-500 hover:text-blue-700 hover:underline" href="2F-authentication.html#"
                    >Enter a two-factor recovery code</a
                  ></span
                >
                <span
                  ><a class="text-blue-500 hover:text-blue-700 hover:underline" href="2F-authentication.html#"
                    >I can't access my two-factor devices</a
                  ></span
                >
              </div>
              <div class="flex w-full flex-row items-center py-5 text-sm font-semibold">
                <a class="hover:text-primary-800 hover:underline" href="signin.html">
                  <span><i class="fas fa-chevron-left"></i></span>
                  <span>Back to Login</span>
                </a>
              </div>
            </div>
          </div>
        </div>
        <div
          class="mx-auto mt-3 flex w-full flex-wrap items-center justify-center space-x-2 whitespace-nowrap py-10 text-xs font-bold text-gray-900 sm:max-w-sm sm:flex-row sm:space-x-4"
        >
          <a class="hover:underline" href="2F-authentication.html#">Terms of Services</a>
          <a class="hover:underline" href="2F-authentication.html#">Privacy Policy</a>
          <a class="hover:underline" href="2F-authentication.html#">Contact us</a>
        </div>
      </div>
      <!-- Back to Top - Start -->
      <button id="back-to-top" class="nk-scroll-to-top" title="Go to Top">
        <i class="fas fa-arrow-up"></i>
      </button>

      <!-- Back to Top - End -->
    </main>

    <!-- Main JS -->
    <script defer src="assets/global/js/main.min.js"></script>

    <!-- Plugins Bundle JS -->
    <script src="assets/global/js/plugins/bundle.plugins.js"></script>

  </body>
</html>
